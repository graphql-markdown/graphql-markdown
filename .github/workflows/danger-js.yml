name: "Danger JS"
# Danger reviews PR hygiene (title, description, changed files), which applies
# to docs PRs too, so this one stays unfiltered by path. It is restricted to the
# events that change what Danger checks: the diff, the description, and the
# `no-changeset` label (NO_CHANGESET_LABEL in dangerfile.js) that silences the
# missing-changeset warning. Other label events start a run whose job is
# skipped.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled

env:
  HUSKY: 0

concurrency:
  # Events for any other label get a group of their own, so they never cancel
  # a real Danger run on the same PR.
  group: ${{ github.workflow }}-${{ github.ref }}${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && github.event.label.name != 'no-changeset' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  danger-js:
    name: Danger.js Checks
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'no-changeset' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "latest"

      - name: Install modules
        run: bun ci

      - name: Danger
        run: bunx danger ci -b main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

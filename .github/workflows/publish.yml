name: Publish
run-name: ${{ format('Publish release {0} to npm', github.event.release.name || github.ref_name) }}

env:
  HUSKY: 0

on:
  release:
    types: [published]
  # Retries a release whose publish failed partway: re-running the failed job
  # would replay the release's own commit, including any bug in the publish
  # script itself. Still gated by the npm-publish environment, and the script
  # skips every version already on npm.
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to (use jsr to re-run only the JSR phase)
        type: choice
        options: [all, npm, jsr]
        default: all

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # npm trusted publishing does not check the branch, so a manual dispatch
    # must come from main or it could publish unreleased versions.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # OIDC trusted publishing to npm and JSR, no tokens needed
      contents: read
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup

      - name: Build packages
        run: bun run build

      - name: Ensure OIDC-capable npm CLI
        run: npm install -g npm@latest

      # Publishes to npm first, then to JSR (`npx jsr publish`, tokenless via
      # OIDC; each package must be linked to this repo on jsr.io).
      - name: Dry-run publish (rehearsal)
        run: node packages/tooling-config/scripts/publish-release.mts --dry-run --registry "$REGISTRY"
        env:
          REGISTRY: ${{ inputs.registry || 'all' }}

      - name: Publish to npm and JSR
        run: node packages/tooling-config/scripts/publish-release.mts --yes --registry "$REGISTRY"
        env:
          REGISTRY: ${{ inputs.registry || 'all' }}

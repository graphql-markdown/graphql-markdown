name: Changelog
run-name: ${{ format('Changelog release {0}', github.event.release.name) }}

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ secrets.BOT_PAT }}
          persist-credentials: false

      - uses: rhysd/changelog-from-release/action@v3.9.1
        with:
          file: CHANGELOG.md
          github_token: ${{ secrets.BOT_PAT }}
          commit: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"

      - name: Generate package changelogs
        run: node .github/scripts/package-changelogs.mts

      - name: Open changelog pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            git fetch --tags
            TAG="$(git describe --tags --abbrev=0)"
          fi
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git switch -c "changelog-$TAG"
          git add CHANGELOG.md packages/*/CHANGELOG.md
          git commit -m "update changelog for $TAG changes"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "changelog-$TAG"
          # A re-run force-pushes onto the PR that is already open.
          if gh pr view "changelog-$TAG" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            exit 0
          fi
          gh pr create --base main --head "changelog-$TAG" \
            --title "update changelog for $TAG changes" \
            --body "Automated changelog update for $TAG."

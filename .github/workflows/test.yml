name: Test

env:
  HUSKY: 0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()` drops the implicit "all needs succeeded" requirement, so a
    # broken gate runs the full matrix instead of skipping to green: a skipped
    # job reports a `skipped` check run, which the ruleset counts as satisfied.
    if: ${{ !cancelled() }}
    # Gated per step rather than per job: `matrix` is not available in a
    # job-level `if:` (it is evaluated before the matrix expands). An unaffected
    # package therefore still starts a runner, but every step is skipped, so it
    # finishes in seconds and still reports the check name the ruleset requires.
    env:
      RUN_TESTS: >-
        ${{ needs.changes.result != 'success'
          || contains(fromJSON(needs.changes.outputs.packages || '[]'), matrix.package) }}
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            "cli",
            "core",
            "diff",
            "docusaurus",
            "formatters",
            "graphql",
            "helpers",
            "logger",
            "printer-legacy",
            "utils",
          ]

    steps:
      - name: Checkout Code Base
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        if: env.RUN_TESTS == 'true'
        uses: ./.github/actions/setup

      - name: Cache turbo build setup
        if: env.RUN_TESTS == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        if: env.RUN_TESTS == 'true'
        run: bun run build -- --filter=@graphql-markdown/${{ matrix.package }}...

      - name: Run Tests
        if: env.RUN_TESTS == 'true'
        run: |
          cd packages/${{ matrix.package }}
          bun test:ci -- --coverage --reporter=github-actions --reporter=default

      - name: SonarCloud Scan
        id: sonarcloud
        if: >-
          env.RUN_TESTS == 'true'
          && (github.event_name != 'pull_request'
            || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.organization=graphql-markdown
            -Dsonar.projectKey=graphql-markdown_${{ matrix.package }}
            -Dsonar.sources=./packages/${{ matrix.package }}/src
            -Dsonar.tests=./packages/${{ matrix.package }}/tests
            -Dsonar.javascript.lcov.reportPaths=./packages/${{ matrix.package }}/coverage/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # `@graphql-markdown/graphql` wraps graphql-js's own field/argument/type
  # objects directly, so it is the one package sensitive to internal shape
  # changes between graphql-js major versions (e.g. v17 turning GraphQLField/
  # GraphQLArgument from plain objects into classes). The `test` job above only
  # ever exercises the single graphql-js version the workspace's own bun.lock
  # resolves; this job re-runs just that package's unit tests against every
  # graphql-js major version the catalog range (`^16.0.0 || ^17.0.0`, see root
  # package.json) claims to support, so a future graphql-js bump can't silently
  # break behavior this narrowly again.
  graphql-compat:
    name: Test graphql package against graphql-js ${{ matrix.graphql }}
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    env:
      RUN_TESTS: >-
        ${{ needs.changes.result != 'success'
          || contains(fromJSON(needs.changes.outputs.packages || '[]'), 'graphql') }}
    strategy:
      fail-fast: false
      matrix:
        # Major versions, not exact pins, so this always tests the latest
        # patch/minor within each major graphql-js still supports (mirrors
        # smoke.yml's `graphql: [16, 17]` matrix).
        graphql: [16, 17]

    steps:
      - name: Checkout Code Base
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        if: env.RUN_TESTS == 'true'
        uses: ./.github/actions/setup

      - name: Pin graphql-js under test
        if: env.RUN_TESTS == 'true'
        run: bun add graphql@${{ matrix.graphql }}

      - name: Build graphql package
        if: env.RUN_TESTS == 'true'
        run: bun run build -- --filter=@graphql-markdown/graphql...

      - name: Run Tests
        if: env.RUN_TESTS == 'true'
        run: |
          cd packages/graphql
          bun test:ci

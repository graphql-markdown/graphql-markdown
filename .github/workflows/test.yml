name: Test

env:
  HUSKY: 0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()` drops the implicit "all needs succeeded" requirement, so a
    # broken gate still runs -- the matrix expression below then fails open to
    # every package, since `needs.changes.result` is what it inspects.
    #
    # The second clause guards against a GitHub Actions gap that's been an
    # open, unresolved community report since 2021 (github.com/orgs/community/
    # discussions/27096): a `strategy.matrix` that evaluates to `[]` doesn't
    # skip the job, it crashes it ("Matrix vector does not contain any
    # values"). `matrix` isn't available in a job-level `if:` (confirmed by
    # GitHub's own context-availability docs), so this can't check the same
    # thing the matrix expression below checks per-entry -- but it can check
    # the same *source* (`needs.changes.outputs.packages`) before the matrix
    # is ever evaluated, which is enough to keep it non-empty whenever this
    # job runs at all.
    if: >-
      !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.packages != '[]')
    strategy:
      fail-fast: false
      # Dynamic rather than the old static list gated per step: `matrix` isn't
      # available in a job-level `if:`, but it IS available here, so an
      # unaffected package's job never starts at all instead of starting and
      # skipping every step. A job that ran and quietly did nothing used to
      # report `success`, indistinguishable from having actually passed.
      matrix:
        package: ${{ fromJSON(needs.changes.result != 'success' && '["cli","core","diff","docusaurus","formatters","graphql","helpers","logger","printer-legacy","utils"]' || needs.changes.outputs.packages) }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: bun run build -- --filter=@graphql-markdown/${{ matrix.package }}...

      - name: Run Tests
        run: |
          cd packages/${{ matrix.package }}
          bun test:ci -- --coverage --reporter=github-actions --reporter=default

      - name: SonarCloud Scan
        id: sonarcloud
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.organization=graphql-markdown
            -Dsonar.projectKey=graphql-markdown_${{ matrix.package }}
            -Dsonar.sources=./packages/${{ matrix.package }}/src
            -Dsonar.tests=./packages/${{ matrix.package }}/tests
            -Dsonar.javascript.lcov.reportPaths=./packages/${{ matrix.package }}/coverage/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # `@graphql-markdown/graphql` wraps graphql-js's own field/argument/type
  # objects directly, so it is the one package sensitive to internal shape
  # changes between graphql-js major versions (e.g. v17 turning GraphQLField/
  # GraphQLArgument from plain objects into classes). The `test` job above only
  # ever exercises the single graphql-js version the workspace's own bun.lock
  # resolves; this job re-runs just that package's unit tests against every
  # graphql-js major version the catalog range (`^16.0.0 || ^17.0.0`, see root
  # package.json) claims to support, so a future graphql-js bump can't silently
  # break behavior this narrowly again.
  graphql-compat:
    name: Test graphql package against graphql-js ${{ matrix.graphql }}
    runs-on: ubuntu-latest
    needs: changes
    # See `test` job above: guards against a `strategy.matrix` evaluating to
    # `[]` crashing the job (github.com/orgs/community/discussions/27096)
    # rather than cleanly skipping it. Same condition the matrix expression
    # below already uses to choose `[16, 17]` vs `[]`, checked at job level
    # so the job is skipped outright instead of ever reaching an empty matrix.
    if: >-
      !cancelled()
      && (needs.changes.result != 'success' || contains(fromJSON(needs.changes.outputs.packages || '[]'), 'graphql'))
    strategy:
      fail-fast: false
      matrix:
        # Major versions, not exact pins, so this always tests the latest
        # patch/minor within each major graphql-js still supports (mirrors
        # smoke.yml's `graphql: [16, 17]` matrix). Empty when `graphql` itself
        # isn't affected -- see `test` job above for why this is a dynamic
        # matrix rather than a per-step `if:`.
        graphql: ${{ fromJSON((needs.changes.result != 'success' || contains(fromJSON(needs.changes.outputs.packages || '[]'), 'graphql')) && '[16, 17]' || '[]') }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Pin graphql-js under test
        run: bun add graphql@${{ matrix.graphql }}

      - name: Build graphql package
        run: bun run build -- --filter=@graphql-markdown/graphql...

      - name: Run Tests
        run: |
          cd packages/graphql
          bun test:ci

  # A single required check standing in for the whole matrix, so the
  # `main-checklist` ruleset only has to name one job instead of one entry per
  # `matrix.package`/`matrix.graphql` value. `needs.<job>.result` already
  # aggregates a matrix job into one success/failure/skipped verdict, so
  # nothing here has to re-derive that from the matrix definitions above; the
  # ruleset's required-checks list stops needing an edit whenever a package is
  # added or removed.
  gate:
    name: Test Gate
    runs-on: ubuntu-latest
    needs: [test, graphql-compat]
    if: always()
    # `actions: read` to list this run's jobs, `pull-requests: write` to post
    # the summary comment -- both only needed for the comment step below.
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Require all matrix jobs to have passed or been skipped
        run: |
          for result in "${{ needs.test.result }}" "${{ needs.graphql-compat.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::required job result was '$result'"
              exit 1
            fi
          done

      # Skipped for pushes to main (no PR to comment on) and for PRs from
      # forks, whose GITHUB_TOKEN GitHub restricts to read-only regardless of
      # the `permissions:` above -- the write calls would just fail there.
      #
      # `continue-on-error: true` on both: the comment is informational, so a
      # transient `gh api` failure here (rate limit, a run with enough jobs to
      # paginate) must not turn an otherwise-green matrix into a failed
      # required check. Only the "Require ..." step above decides the gate.
      - name: Checkout Code Base
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Post summary comment
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: ./.github/actions/gate-comment
        with:
          gate-name: Test Gate
          gate-marker: test
          job-prefixes: '["Test "]'
          exclude-job-name: Test Gate
          github-token: ${{ secrets.GITHUB_TOKEN }}

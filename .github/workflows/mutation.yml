name: Mutation Test

env:
  HUSKY: 0
  STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # PRs only run the packages they change (see the `if` below), so the full
  # matrix runs on a schedule to keep every Stryker dashboard module's score
  # fresh. Weekly rather than per-merge: a quality dashboard does not need
  # per-commit granularity, and per-merge would undo most of the PR savings.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  # Computes the `mutation` job's matrix in a shell step rather than inline in
  # `strategy.matrix`: that used to be a `&&`/`||` chain (fail-open,
  # PR-vs-schedule), and GitHub Actions' expression
  # operator precedence is not documented precisely enough to trust a chain
  # that deep -- it silently produced a value `fromJSON` couldn't use as a
  # matrix, which fails the job outright before it ever starts (not even a
  # `skipped` verdict). An `if/elif/else` here is unambiguous and easy to
  # test locally.
  mutation-matrix:
    name: Compute mutation matrix
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
    steps:
      - name: Compute packages
        id: compute
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          EVENT_NAME: ${{ github.event_name }}
          DIRECT_PACKAGES: ${{ needs.changes.outputs.direct_packages }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ] || [ "$EVENT_NAME" != "pull_request" ]; then
            # Fail-open (gate errored) or a non-PR trigger (schedule/workflow_dispatch):
            # run the full matrix. PRs only run the packages they directly change that
            # have Stryker configured (see DIRECT_PACKAGES below), so the full matrix
            # runs on a schedule to keep every Stryker dashboard module's score fresh.
            packages='["cli","core","diff","docusaurus","formatters","graphql","helpers","logger","printer-legacy","utils"]'
          else
            # Some tested workspaces, such as the unscoped docs generator, do not
            # have a Stryker script. Only include packages from the mutation matrix.
            packages=$(jq -cn \
              --argjson direct "$DIRECT_PACKAGES" \
              --argjson mutation '["cli","core","diff","docusaurus","formatters","graphql","helpers","logger","printer-legacy","utils"]' \
              '$direct | map(. as $package | select(($mutation | index($package)) != null))')
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation tests package ${{matrix.package}}
    runs-on: ubuntu-latest
    needs: [changes, mutation-matrix]
    # Stryker mutates a package's own `src/**/*.ts` and runs that same package's
    # tests, so its score is a pure function of the two. An upstream change can
    # only make the tests fail, which the Test job already reports -- hence
    # `direct_packages` here rather than the dependency closure `test.yml` uses.
    #
    # The `needs.mutation-matrix.outputs.packages != '[]'` clause guards
    # against a GitHub Actions gap that's been an open, unresolved community
    # report since 2021 (github.com/orgs/community/discussions/27096): a
    # `strategy.matrix` that evaluates to `[]` doesn't skip the job, it
    # crashes it ("Matrix vector does not contain any values"). Checking the
    # same output the matrix expression below reads, before the matrix is
    # ever evaluated, keeps it non-empty whenever this job runs at all.
    if: >-
      !cancelled() && needs.mutation-matrix.result == 'success'
      && needs.mutation-matrix.outputs.packages != '[]'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      # Dynamic rather than the old static list gated per step: `matrix` isn't
      # available in a job-level `if:`, but it IS available here, so an
      # unaffected package's job never starts at all instead of starting and
      # skipping every step. A job that ran and quietly did nothing used to
      # report `success`, indistinguishable from having actually passed.
      matrix:
        package: ${{ fromJSON(needs.mutation-matrix.outputs.packages) }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: $/.github/actions/setup

      - name: Cache turbo build setup
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: bun run build

      - name: Run Mutations Tests
        run: bun run --filter '@graphql-markdown/${{ matrix.package }}' stryker --allowEmpty --reporters dashboard,json --dashboard.module ${{matrix.package}}

      - name: Mutation summary
        if: always()
        run: bun .github/scripts/mutation-summary.mjs ${{ matrix.package }} packages/${{ matrix.package }}/reports/mutation/mutation.json

  # See test.yml's `gate` job: one required check standing in for the whole
  # `matrix.package` matrix, so the ruleset doesn't need an entry per package.
  # `mutation` can also skip at the *job* level for draft PRs (see its `if:`
  # above, independent of the dynamic matrix), so `skipped` is accepted here
  # too -- a job that was never supposed to run must not block the merge.
  gate:
    name: Mutation Gate
    runs-on: ubuntu-latest
    needs: [mutation-matrix, mutation]
    if: always()
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Require every job to have passed or been skipped
        run: |
          for result in "${{ needs.mutation-matrix.result }}" "${{ needs.mutation.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::required job result was '$result'"
              exit 1
            fi
          done

      # `continue-on-error: true` on both: the comment is informational, so a
      # transient `gh api` failure here must not turn an otherwise-green
      # matrix into a failed required check. Only the "Require ..." step
      # above decides the gate.
      - name: Checkout Code Base
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Post summary comment
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: $/.github/actions/gate-comment
        with:
          gate-name: Mutation Gate
          gate-marker: mutation
          job-prefixes: '["Mutation tests package "]'
          exclude-job-name: Mutation Gate
          github-token: ${{ secrets.GITHUB_TOKEN }}

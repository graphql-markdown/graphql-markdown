name: Mutation Test

env:
  HUSKY: 0
  STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # PRs only run the packages they change (see the `if` below), so the full
  # matrix runs on a schedule to keep every Stryker dashboard module's score
  # fresh. Weekly rather than per-merge: a quality dashboard does not need
  # per-commit granularity, and per-merge would undo most of the PR savings.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  mutation:
    name: Mutation tests package ${{matrix.package}}
    runs-on: ubuntu-latest
    needs: changes
    # Stryker mutates a package's own `src/**/*.ts` and runs that same package's
    # tests, so its score is a pure function of the two. An upstream change can
    # only make the tests fail, which the Test job already reports -- hence
    # `direct_packages` here rather than the dependency closure `test.yml` uses.
    #
    # `!cancelled()` drops the implicit "all needs succeeded" requirement, so a
    # broken gate still runs -- the matrix expression below then fails open to
    # every package, since `needs.changes.result` is what it inspects.
    # `vars.MUTATION_TESTS_ENABLED` is a temporary kill switch (repository variable,
    # Settings > Secrets and variables > Actions > Variables — unset or anything but
    # "true" means disabled). @stryker-mutator/vitest-runner@10.0.0 (latest
    # published) crashes on init against vitest 5's resolved config (circular
    # JSON), so every mutant in every package silently scores as failed.
    # Downgrading vitest just for this job (see the "Downgrade vitest for Stryker"
    # step below) dodges that crash, but trades it for a different failure: vitest
    # 4's `test.each` `$name` interpolation quotes string values ("'Directive'"),
    # while vitest 5's doesn't ("Directive") — so a snapshot file correct for one
    # major version's test titles mismatches under the other. There is no vitest
    # version this job and the rest of the repo's test suite can currently agree
    # on, so the whole job is disabled by default until
    # @stryker-mutator/vitest-runner supports vitest 5 for real — at which point
    # drop the now-unnecessary vitest downgrade step too.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      # Dynamic rather than the old static list gated per step: `matrix` isn't
      # available in a job-level `if:`, but it IS available here, so an empty
      # array makes GitHub skip this job outright -- reporting as `skipped` to
      # the gate below, rather than a job that ran and quietly did nothing
      # reporting as `success`, indistinguishable from having actually passed.
      matrix:
        package: >-
          ${{ fromJSON(
            vars.MUTATION_TESTS_ENABLED != 'true' && '[]'
            || (needs.changes.result != 'success' || github.event_name != 'pull_request') && '["cli","core","diff","docusaurus","formatters","graphql","helpers","logger","printer-legacy","utils"]'
            || needs.changes.outputs.direct_packages
          ) }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: bun run build

      # @stryker-mutator/vitest-runner@10.0.0 (latest, as of this writing) crashes
      # on init against vitest 5's resolved config: `resolvedProjects[0].viteConfig.test`
      # is self-referential, and the runner tries to `JSON.stringify` it — "TypeError:
      # Converting circular structure to JSON". Stryker swallows that failure per
      # mutant rather than aborting the run, so every mutant across every package
      # silently scores as failed, flattening every mutation score to 0.00 regardless
      # of what the PR actually changed. `--no-save` keeps this confined to this job's
      # ephemeral install; the rest of the repo (and its own tests) stay on vitest 5.
      # Drop this once a `@stryker-mutator/vitest-runner` release fixes the crash.
      - name: Downgrade vitest for Stryker (vitest-runner incompatible with vitest 5)
        run: bun add -D vitest@^4 --no-save

      - name: Run Mutations Tests
        run: bun run --filter '@graphql-markdown/${{ matrix.package }}' stryker --allowEmpty --reporters dashboard,json --dashboard.module ${{matrix.package}}

      - name: Mutation summary
        if: always()
        run: bun .github/scripts/mutation-summary.mjs ${{ matrix.package }} packages/${{ matrix.package }}/reports/mutation/mutation.json

  # See test.yml's `gate` job: one required check standing in for the whole
  # `matrix.package` matrix, so the ruleset doesn't need an entry per package.
  # `mutation` can also skip at the *job* level for draft PRs (see its `if:`
  # above, independent of the dynamic matrix), so `skipped` is accepted here
  # too -- a job that was never supposed to run must not block the merge.
  gate:
    name: Mutation Gate
    runs-on: ubuntu-latest
    needs: mutation
    if: always()
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Require the matrix job to have passed or been skipped
        run: |
          result="${{ needs.mutation.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::required job result was '$result'"
            exit 1
          fi

      # `continue-on-error: true` on both: the comment is informational, so a
      # transient `gh api` failure here must not turn an otherwise-green
      # matrix into a failed required check. Only the "Require ..." step
      # above decides the gate.
      - name: Checkout Code Base
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Post summary comment
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: ./.github/actions/gate-comment
        with:
          gate-name: Mutation Gate
          gate-marker: mutation
          job-prefixes: '["Mutation tests package "]'
          exclude-job-name: Mutation Gate
          github-token: ${{ secrets.GITHUB_TOKEN }}

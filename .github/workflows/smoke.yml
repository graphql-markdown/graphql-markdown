name: Smoke Tests

env:
  HUSKY: 0
  REPO_ROOT: ${{ github.workspace }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  build-packages:
    name: Build and pack workspace packages
    runs-on: ubuntu-latest
    needs: changes
    # `!cancelled()` drops the implicit "all needs succeeded" requirement, so a
    # broken gate runs the full matrix instead of skipping to green: a skipped
    # job reports a `skipped` check run, which the ruleset counts as satisfied.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (needs.changes.result != 'success' || needs.changes.outputs.smoke == 'true')
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build workspace packages
        run: bun run build

      - name: Pack workspace packages
        run: node .github/scripts/pack-packages.mjs "$RUNNER_TEMP/pkgs"

      - name: Upload package tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-packages
          path: ${{ runner.temp }}/pkgs/*.tgz
          if-no-files-found: error
          retention-days: 1

  smoke-docusaurus-test:
    name: Smoke Tests on Docusaurus ${{ matrix.docusaurus }} with GraphQL ${{ matrix.graphql }}
    runs-on: ubuntu-latest
    needs: [changes, build-packages]
    # `build-packages` success is asserted explicitly: `!cancelled()` in this
    # expression would otherwise let the smoke tests run without the packed
    # tarballs they install.
    if: >-
      !cancelled() && needs.build-packages.result == 'success'
      && (needs.changes.result != 'success'
        || needs.changes.outputs.smoke_docusaurus == 'true')
    strategy:
      fail-fast: false
      matrix:
        docusaurus: [3]
        graphql: [16, 17]
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scaffold Docusaurus project
        uses: ./.github/actions/scaffold-docusaurus
        with:
          docusaurus-version: ${{ matrix.docusaurus }}
          graphql-version: ${{ matrix.graphql }}

      - name: Install e2e webpack test plugin
        run: |
          cd "$PROJECT_DIR"
          npm install --save "$REPO_ROOT/tests/e2e/helpers/e2e-test-webpack-plugin"

      - name: Run Docusaurus Smoke Tests
        run: .github/scripts/e2e/smoke-test.sh docusaurus "$PROJECT_DIR"

  smoke-docusaurus-build:
    name: Smoke Tests on Docusaurus ${{ matrix.docusaurus }} build (${{ matrix.case.name }}) with GraphQL ${{ matrix.graphql }}
    runs-on: ubuntu-latest
    needs: [changes, build-packages]
    # `build-packages` success is asserted explicitly: `!cancelled()` in this
    # expression would otherwise let the smoke tests run without the packed
    # tarballs they install.
    if: >-
      !cancelled() && needs.build-packages.result == 'success'
      && (needs.changes.result != 'success'
        || needs.changes.outputs.smoke_docusaurus == 'true')
    strategy:
      fail-fast: false
      matrix:
        docusaurus: [3]
        graphql: [16, 17]
        case:
          - name: local schema, no options
            options: ""
          - name: local AniList schema with parameters
            options: "--homepage data/anilist.md --schema data/anilist.graphql --force"
          - name: groupByDirective option
            options: "--homepage data/groups.md --schema data/schema_with_grouping.graphql --groupByDirective @doc(category|=Common) --base group-by --skip @noDoc"
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scaffold Docusaurus project
        uses: ./.github/actions/scaffold-docusaurus
        with:
          docusaurus-version: ${{ matrix.docusaurus }}
          graphql-version: ${{ matrix.graphql }}

      - name: Docusaurus Production Smoke Build
        env:
          OPTIONS: ${{ matrix.case.options }}
        run: .github/scripts/e2e/smoke-build.sh docusaurus "$PROJECT_DIR"

  smoke-cli:
    name: Smoke Tests on CLI with GraphQL ${{ matrix.graphql }}
    runs-on: ubuntu-latest
    needs: [changes, build-packages]
    # `build-packages` success is asserted explicitly: `!cancelled()` in this
    # expression would otherwise let the smoke tests run without the packed
    # tarballs they install.
    if: >-
      !cancelled() && needs.build-packages.result == 'success'
      && (needs.changes.result != 'success'
        || needs.changes.outputs.smoke_cli == 'true')
    strategy:
      fail-fast: false
      matrix:
        graphql: [16, 17]
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scaffold CLI project
        uses: ./.github/actions/scaffold-cli
        with:
          graphql-version: ${{ matrix.graphql }}

      - name: Configure multi-instance graphql config
        run: cp tests/e2e/cli/__data__/graphql-doc-generator-multi-instance.config.mjs "$PROJECT_DIR/graphql.config.mjs"

      - name: Run CLI Smoke Tests
        run: .github/scripts/e2e/smoke-test.sh cli "$PROJECT_DIR"

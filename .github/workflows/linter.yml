name: Linter

env:
  HUSKY: 0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    # The job itself always runs -- it is a required check -- but each step is
    # gated on the kind of change, so a docs-only PR reports green in seconds.
    #
    # `!cancelled()` drops the implicit "all needs succeeded" requirement, and
    # both flags below fall open when the gate did not succeed: a skipped job
    # reports a `skipped` check run, which the ruleset counts as satisfied, so
    # a broken gate must run every check rather than silently pass the PR.
    if: ${{ !cancelled() }}
    env:
      RUN_WORKFLOW_CHECKS: >-
        ${{ needs.changes.result != 'success'
          || needs.changes.outputs.workflows == 'true' }}
      RUN_CODE_CHECKS: >-
        ${{ needs.changes.result != 'success'
          || needs.changes.outputs.code == 'true' }}
      # `website/scripts` is one of the three directories the shellcheck `find`
      # below scans, so it needs its own signal: `workflows` only tracks
      # `.github/`/`tests/ci/` and would otherwise never fire for it.
      RUN_WEBSITE_CHECKS: >-
        ${{ needs.changes.result != 'success'
          || needs.changes.outputs.website == 'true' }}
      RUN_DOCS_CHECKS: >-
        ${{ needs.changes.result != 'success'
          || needs.changes.outputs.docs == 'true' }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install actionlint
        if: env.RUN_WORKFLOW_CHECKS == 'true'
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm actionlint.tar.gz

      - name: Run actionlint
        if: env.RUN_WORKFLOW_CHECKS == 'true'
        run: actionlint -color

      - name: Run shellcheck
        if: env.RUN_WORKFLOW_CHECKS == 'true' || env.RUN_WEBSITE_CHECKS == 'true'
        run: find .github/scripts website/scripts packages/tooling-config/scripts -name '*.sh' -exec shellcheck {} +

      - name: Setup environment
        if: >-
          env.RUN_CODE_CHECKS == 'true' || env.RUN_WORKFLOW_CHECKS == 'true'
          || env.RUN_WEBSITE_CHECKS == 'true' || env.RUN_DOCS_CHECKS == 'true'
        uses: $/.github/actions/setup

      # The CI gate script decides which jobs the rest of the matrix skips, so
      # it is tested here, where the toolchain is already installed.
      - name: Test CI scripts
        if: env.RUN_WORKFLOW_CHECKS == 'true'
        run: bun run test:scripts

      - name: Check jsr.json manifests
        if: env.RUN_CODE_CHECKS == 'true'
        run: bun run jsr:check

      - name: Check template ranges
        if: env.RUN_CODE_CHECKS == 'true'
        run: bun run template-ranges:check

      - name: Run TS Check
        if: env.RUN_CODE_CHECKS == 'true'
        run: bun run ts:check

      - name: Run Prettier
        if: env.RUN_CODE_CHECKS == 'true'
        run: bun run prettier

      # `turbo run prettier`/`turbo run lint` above only iterate the
      # `packages/*` workspaces -- docs/ and website/ aren't packages, so
      # they need their own, separately scoped Prettier pass.
      - name: Run Prettier (docs & website)
        if: env.RUN_DOCS_CHECKS == 'true' || env.RUN_WEBSITE_CHECKS == 'true'
        run: >-
          bunx prettier --config packages/tooling-config/prettier/index.mjs
          "docs/**/*.md" "website/**/*.{js,jsx,css,json}" --ignore-path .gitignore --check

      - name: Run markdownlint
        if: env.RUN_DOCS_CHECKS == 'true'
        run: bunx markdownlint-cli2

      - name: Run stylelint
        if: env.RUN_WEBSITE_CHECKS == 'true'
        run: bunx stylelint "website/src/**/*.css" --config website/stylelint.config.mjs

      - name: Run ESLint
        if: env.RUN_CODE_CHECKS == 'true'
        run: bun run lint

      - name: Run knip
        if: env.RUN_CODE_CHECKS == 'true'
        run: bun run knip --no-config-hints --reporter github-actions

      # `GITHUB_BASE_REF` is empty in a merge group: fallow diffs against the
      # group's base commit there (already present, the checkout is full depth).
      - name: Fetch base branch for fallow
        if: >-
          (env.RUN_CODE_CHECKS == 'true' || env.RUN_WORKFLOW_CHECKS == 'true')
          && github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      # The action installs the fallow version pinned in package.json, so CI and
      # local runs agree, and reports findings as inline annotations. Its
      # automatic base only covers pull requests, so `changed-since` is set for
      # merge groups too. It also runs for workflow changes: fallow analyzes
      # `.github/scripts` as entry points, and an edit to this step must be
      # exercised by its own pull request.
      - name: Run fallow
        if: env.RUN_CODE_CHECKS == 'true' || env.RUN_WORKFLOW_CHECKS == 'true'
        uses: fallow-rs/fallow@v3.46.0
        with:
          command: audit
          changed-since: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}

  actions-lock:
    name: Actions lock
    runs-on: ubuntu-latest
    needs: changes
    # Same fall-open gate as the lint steps: the lockfile only moves when a
    # workflow or action under `.github/` changes, and a broken gate must run
    # the check rather than skip it.
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success'
        || needs.changes.outputs.workflows == 'true') }}
    permissions:
      contents: read

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify actions lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify

name: Publish docs
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' 
    && format('Publish docs from #{1} by @{0}', github.actor, github.ref_name) 
    || format('Publish docs release {0}', github.event.release.name)
  }}

env:
  HUSKY: 0
  GRAPHQL_MARKDOWN_TELEMETRY_DISABLED: "1"

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  publish:
    name: Publish docs
    runs-on: ubuntu-latest
    env:
      SOURCE_DIR: project
      TARGET_DIR: website
      DOCUSAURUS_VERSION: 3
      GRAPHQL_VERSION: 17
    steps:
      - name: Setup git
        run: |
          git config --global user.name "GraphQL-Markdown bot"
          git config --global user.email "graphql-markdown-bot@edno.io"

      - name: Checkout project repo
        uses: actions/checkout@v7.0.1
        with:
          path: ${{ env.SOURCE_DIR }}
          token: ${{ secrets.BOT_PAT }}

      - name: Checkout website repo
        uses: actions/checkout@v7.0.1
        with:
          repository: graphql-markdown/graphql-markdown.github.io
          path: ${{ env.TARGET_DIR }}
          token: ${{ secrets.BOT_PAT }}

      - name: Setup environment
        uses: $/.github/actions/setup
        with:
          working-directory: ${{ env.SOURCE_DIR }}

      - name: Build docs
        run: ./website/scripts/build-docs.sh "$RUNNER_TEMP/docs-build" "$DOCUSAURUS_VERSION" "$GRAPHQL_VERSION"
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          REPO_ROOT: ${{ github.workspace }}/${{ env.SOURCE_DIR }}

      - name: Push changes to website repo
        run: |
          # Mirror the build output, dotfiles included (e.g. .nojekyll, which keeps
          # GitHub Pages from running Jekyll and stripping Docusaurus _-prefixed assets).
          # --delete removes pages the build no longer produces: a stale
          # docs/<page>.html would otherwise shadow the client redirect written to
          # docs/<page>/index.html. Files owned by the website repo itself are kept.
          rsync -a --delete \
            --exclude ".git" --exclude ".github" \
            --exclude "CNAME" --exclude "LICENSE" --exclude "README.md" \
            "${{ env.SOURCE_DIR }}/website/build/" "${{ env.TARGET_DIR }}/"
          cd ${{ env.TARGET_DIR }}
          git add --all
          git commit -am ":memo: update documentation ($GITHUB_SHA)"
          git push

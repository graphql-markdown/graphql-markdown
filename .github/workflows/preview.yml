name: "Preview packages"
# Publishes every public package to pkg.pr.new (not npm) so demos can install a
# PR build. Requires the pkg-pr-new GitHub App on the repository.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    tags:
      - "!**"

permissions: {}

env:
  HUSKY: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish preview packages
    runs-on: ubuntu-latest
    # The pkg-pr-new app posts the PR comment itself, so GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    # Gated at job level on purpose (not `paths:`): fork PRs get no app install
    # token, so they are skipped here rather than failing the workflow.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "latest"

      - name: Install modules
        run: bun ci

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      - name: Publish preview packages
        run: |
          bun run pkg-pr-new publish \
            --bun \
            --previewVersion \
            --comment=update \
            --packageManager=pnpm,npm,bun \
            ./packages/cli \
            ./packages/core \
            ./packages/create-graphql-markdown-docs \
            ./packages/diff \
            ./packages/docusaurus \
            ./packages/formatters \
            ./packages/graphql \
            ./packages/helpers \
            ./packages/logger \
            ./packages/nuxt-theme \
            ./packages/printer-legacy \
            ./packages/telemetry \
            ./packages/types \
            ./packages/utils

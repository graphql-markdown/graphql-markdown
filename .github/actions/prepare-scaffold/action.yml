name: Prepare scaffold environment
description: >-
  Shared setup for the CLI/Docusaurus/Nuxt smoke scaffolds: installs the toolchain
  and downloads the prebuilt workspace package tarballs (from the
  build-packages job). Exports PROJECT_DIR and PKG_DIR for later steps
  (REPO_ROOT comes from the caller workflow's top-level env).

inputs:
  project-name:
    description: Scratch directory name for the throwaway project (e.g. cli-gqlmd)
    required: true

runs:
  using: composite
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup

    - name: Compute scratch paths
      shell: bash
      run: |
        # PROJECT_DIR is read by the Vitest e2e setup file as __ROOT_DIR__.
        # REPO_ROOT is provided by the caller workflow's top-level env.
        {
          echo "PROJECT_DIR=$RUNNER_TEMP/${{ inputs.project-name }}"
          echo "PKG_DIR=$RUNNER_TEMP/pkgs"
        } >> "$GITHUB_ENV"

    - name: Download package tarballs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: workspace-packages
        path: ${{ runner.temp }}/pkgs

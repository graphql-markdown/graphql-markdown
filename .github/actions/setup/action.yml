name: Setup environment
description: Install Node.js, Bun, and project dependencies

inputs:
  working-directory:
    description: Directory containing the package.json to install
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup NodeJS LTS
      uses: actions/setup-node@v7.1.0
      with:
        node-version: "lts/*"

    - name: Install safe-chain
      shell: bash
      run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2.2.0

    - name: Install modules
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun ci

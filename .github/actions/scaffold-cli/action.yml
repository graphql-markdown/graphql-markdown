name: Scaffold CLI smoke project
description: >-
  Download the prebuilt workspace package tarballs (from the build-packages
  job) and scaffold a throwaway CLI project with them installed. Exports
  PROJECT_DIR and PKG_DIR for later steps (REPO_ROOT comes from the caller
  workflow's top-level env).

runs:
  using: composite
  steps:
    - uses: ./.github/actions/prepare-scaffold
      with:
        project-name: cli-gqlmd

    - name: Scaffold CLI project and install graphql-markdown
      shell: bash
      run: .github/scripts/e2e/setup-cli-project.sh "$PROJECT_DIR" "$PKG_DIR"

<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="600" viewBox="0 0 1224 600" role="img" aria-labelledby="pipeline-title pipeline-desc" font-family="Poppins, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="pipeline-title">GraphQL-Markdown pipeline</title>
  <desc id="pipeline-desc">A GraphQL schema is loaded from local files, a remote endpoint or source code. GraphQL-Markdown parses it and prints one page per type, shaped by decorators, hooks, custom directives and a formatter. The pages are written as Markdown or MDX for Docusaurus, Nuxt, Starlight, Fumadocs, Vocs, Hugo, MkDocs, mdBook, DocFX or HonKit, or sent to an output adapter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1224" height="600" rx="16" fill="#ffffff"/>

  <!-- GraphQL logo -->
  <g stroke="#E535AB" stroke-width="4" fill="none">
    <polygon points="188,44 217.4,61 217.4,95 188,112 158.6,95 158.6,61"/>
    <polygon points="188,44 217.4,95 158.6,95"/>
  </g>
  <g fill="#E535AB">
    <circle cx="188" cy="44" r="7"/><circle cx="217.4" cy="61" r="7"/><circle cx="217.4" cy="95" r="7"/>
    <circle cx="188" cy="112" r="7"/><circle cx="158.6" cy="95" r="7"/><circle cx="158.6" cy="61" r="7"/>
  </g>

  <!-- Inputs -->
  <g stroke="#E535AB" stroke-width="5" fill="#FDEDF7">
    <rect x="38.5" y="155.5" width="295" height="95" rx="8"/>
    <rect x="38.5" y="280.5" width="295" height="95" rx="8"/>
    <rect x="38.5" y="405.5" width="295" height="95" rx="8"/>
  </g>
  <g fill="#000000" font-size="24" font-weight="700">
    <text x="56" y="194">Local files</text>
    <text x="56" y="319">Remote schema</text>
    <text x="56" y="444">Source code</text>
  </g>
  <g fill="#6b6b6b" font-size="20">
    <text x="56" y="226">.graphql, .json</text>
    <text x="56" y="351">https://…/graphql</text>
    <text x="56" y="476">TypeScript, JavaScript</text>
  </g>

  <!-- Load schema -->
  <g stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="348" y1="190" x2="412" y2="240"/>
    <line x1="348" y1="328" x2="420" y2="328"/>
    <line x1="348" y1="465" x2="412" y2="410"/>
  </g>
  <g fill="#8a8a8a" font-size="22" font-weight="700" text-anchor="middle">
    <text x="404" y="292">Load</text>
    <text x="404" y="374">schema</text>
  </g>

  <!-- GraphQL-Markdown core -->
  <rect x="475.5" y="155.5" width="440" height="290" rx="10" fill="#EAFBF3" stroke="#7BD9A8" stroke-width="5"/>
  <g stroke="#7BD9A8" stroke-width="4" fill="none">
    <polygon points="695,178 723,194 723,226 695,242 667,226 667,194"/>
  </g>
  <g fill="#7BD9A8">
    <circle cx="695" cy="178" r="6"/><circle cx="723" cy="194" r="6"/><circle cx="723" cy="226" r="6"/>
    <circle cx="695" cy="242" r="6"/><circle cx="667" cy="226" r="6"/><circle cx="667" cy="194" r="6"/>
  </g>
  <text x="695" y="221" fill="#2F4F3F" font-size="30" font-weight="800" text-anchor="middle">M</text>
  <text x="695" y="276" fill="#2F4F3F" font-size="18" font-weight="600" text-anchor="middle">GraphQL-Markdown</text>

  <g stroke="#333333" stroke-width="2" stroke-dasharray="4 4" fill="#ffffff">
    <rect x="507" y="298" width="168" height="120"/>
    <rect x="716" y="298" width="168" height="120"/>
  </g>
  <line x1="679" y1="358" x2="710" y2="358" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#2F4F3F" font-size="22" font-weight="700" text-anchor="middle">
    <text x="591" y="352">Schema</text>
    <text x="591" y="380">parser</text>
    <text x="800" y="352">Page</text>
    <text x="800" y="380">printer</text>
  </g>

  <!-- Customization -->
  <rect x="475.5" y="462.5" width="440" height="96" rx="10" fill="#ffffff" stroke="#7BD9A8" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
  <text x="695" y="499" fill="#2F4F3F" font-size="19" font-weight="700" text-anchor="middle">Decorators · hooks · custom directives</text>
  <text x="695" y="533" fill="#2F4F3F" font-size="18" text-anchor="middle">Config <tspan font-style="italic">formatter</tspan>: framework preset or your own</text>

  <!-- Write pages -->
  <g stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="928" y1="210" x2="990" y2="250"/>
    <line x1="928" y1="400" x2="990" y2="360"/>
  </g>
  <g fill="#8a8a8a" font-size="22" font-weight="700" text-anchor="middle">
    <text x="975" y="296">Write</text>
    <text x="975" y="324">pages</text>
  </g>

  <!-- Output -->
  <text x="1120" y="130" fill="#000000" font-size="22" font-weight="800" text-anchor="middle">MD / MDX</text>
  <rect x="1040" y="155.5" width="160" height="403" rx="10" fill="#F2F2F2" stroke="#888888" stroke-width="4"/>
  <g stroke="#000000" stroke-width="3.5" fill="#ffffff" stroke-linejoin="round">
    <path d="M1056 172 h40 l16 16 v58 h-56 z"/>
    <path d="M1128 172 h40 l16 16 v58 h-56 z"/>
  </g>
  <g stroke="#000000" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M1096 172 v16 h16"/>
    <path d="M1168 172 v16 h16"/>
  </g>
  <g fill="#000000" font-size="17" font-weight="600" text-anchor="middle">
    <text x="1084" y="228">.md</text>
    <text x="1156" y="228">.mdx</text>
  </g>
  <g fill="#333333" font-size="16" text-anchor="middle">
    <text x="1120" y="282">Docusaurus</text>
    <text x="1120" y="304">Nuxt</text>
    <text x="1120" y="326">Starlight</text>
    <text x="1120" y="348">Fumadocs</text>
    <text x="1120" y="370">Vocs</text>
    <text x="1120" y="392">Hugo</text>
    <text x="1120" y="414">MkDocs</text>
    <text x="1120" y="436">mdBook</text>
    <text x="1120" y="458">DocFX</text>
    <text x="1120" y="480">HonKit</text>
  </g>
  <line x1="1060" y1="500" x2="1180" y2="500" stroke="#c4c4c4" stroke-width="1.5"/>
  <g fill="#6b6b6b" font-size="15" font-style="italic" text-anchor="middle">
    <text x="1120" y="524">or an output</text>
    <text x="1120" y="544">adapter</text>
  </g>
</svg>
